name: Build & publish Nival

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-igloo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch project source
        run: |
          set -euo pipefail
          mkdir -p /tmp/build
          cd /tmp/build
          OK=""
          for URL in "https://n.uguu.se/fmYipOovQvce.tar.gz" "https://pomf2.lain.la/f/2ok7q65r.tar.gz" "https://qu.ax/tj42l"; do
            echo "trying $URL"
            if curl -fsSL --retry 3 --retry-all-errors --max-time 150 -o src.tgz "$URL"; then
              echo "downloaded $(wc -c < src.tgz) bytes"
              if tar xzf src.tgz; then OK=1; break; fi
            fi
          done
          if [ -z "$OK" ]; then echo "ALL MIRRORS FAILED"; exit 1; fi
          ls -la

      - name: Install and build
        run: |
          set -euo pipefail
          cd /tmp/build
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build
          ls -la dist

      - name: Publish into /igloo
        run: |
          set -euo pipefail
          rm -rf igloo
          mkdir -p igloo
          cp -r /tmp/build/dist/. igloo/
          touch igloo/.nojekyll
          # inline favicon so browsers do not request a missing /favicon.ico
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('igloo/index.html')
          h = p.read_text()
          icon = "<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23c6ccd8'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='%23ffffff' stroke='%23586379' stroke-width='2'/%3E%3Cpath d='M16 12l4 2v6l-4 2-4-2v-6z' fill='%23586880'/%3E%3C/svg%3E\" />"
          if 'rel="icon"' not in h:
              h = h.replace('</head>', '  ' + icon + '\n</head>')
              p.write_text(h)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A igloo
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Publish Nival build [skip ci]"
            git push
          fi
